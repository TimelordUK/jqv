# jqv's config (DESIGN §13), written by `jqv config init`. A line commented out is the default.
# Each [set] option is a :set name, so `:set nonu` changes it for one session; the file is
# never written back, so edit it by hand. A mistake here is reported at start-up, never fatal.

[set]
number = true            # row numbers in a gutter (nu)
# relativenumber = false # row numbers relative to the cursor (rnu)
# scrolllock = false     # keep the cursor on the middle row (zl)
depth = 2                # how far the document is open at the start

[repl]
pipe = "bat -l json"     # what a bare :! sends the last result to (bat: winget install sharkdp.bat)
# lines = 60             # where a line's output is cut; 0 shows it all
# sort_keys = false      # true: objects' keys sorted, as jq -S (:sortkeys toggles); false keeps them as written

[keys]
# The REPL's keys: an action, a command line run as if typed, or "" for nothing. Uncomment to
# change one; a key's name is what `jqv repl --show-keys file.json` prints when it is pressed.
# f1 = "help"                         # :help on the word under the cursor
# f2 = ":!"                           # the last result into [repl] pipe
# f3 = "scope"                        # what . is at the cursor, as a stack
# f5 = "run-to-cursor"                # run the line up to the cursor
# f8 = "layout"                       # lay the entry out over lines; again to join it
# "ctrl+up" = "step-back"             # step back along the pipeline
# "ctrl+down" = "step-on"             # and on
# "ctrl+]" = "match-bracket"          # to the matching bracket
# f6 = ":pp"                          # any command can have a key
